name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q -o AppleStockMonitor-Android-GitHub.zip -d extracted
          echo "项目文件："
          find extracted -name settings.gradle.kts -print

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到项目：$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleStockMonitor-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
